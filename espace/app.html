<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Application PLAN B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Application PLAN B · charte Caddoux (bordeaux + doré, Sora). Interface sans données : tout vient du Drive de Jeff. */
:root{
  --bordeaux:#7B1E3A;--bordeaux-2:#9C566B;--nuit:#1C1417;--dore:#F2B705;--dore-txt:#85650F;
  --rose:#F6E6EA;--dore-pale:#FEF4D6;--mark:#FCE7A8;--filet:#F7D46B;--sauge:#DDE9E1;
  --bg:#FFFCFA;--bg-alt:#FBF1F3;--fg:#1C1417;--muted:#5E4E54;--line:#E8D6DB;--card:#FFFFFF;
  --side:#7B1E3A;--side-fg:#FFF7F8;--alerte:#B3261E;
  --font:"Sora","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1417;--bg-alt:#24191D;--fg:#F6E6EA;--muted:#C7B3BA;--line:#3D2A31;--card:#2A1D22;
  --side:#4A0F22;--dore-txt:#F2B705;--rose:#3A2229;--dore-pale:#33290F;--mark:#5C4708;--sauge:#22332A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1417;--bg-alt:#24191D;--fg:#F6E6EA;--muted:#C7B3BA;--line:#3D2A31;--card:#2A1D22;
  --side:#4A0F22;--dore-txt:#F2B705;--rose:#3A2229;--dore-pale:#33290F;--mark:#5C4708;--sauge:#22332A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font);}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bordeaux)} :root[data-theme="dark"] a{color:var(--dore)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:var(--dore)}}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-fg);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.marque{display:flex;gap:12px;align-items:center;margin:0 6px 22px}
.marque b{display:block;font-weight:700;font-size:15px;letter-spacing:.01em}
.marque small{display:block;font-size:11.5px;opacity:.8}
nav button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;color:inherit;
  padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;opacity:.86}
nav button:hover{background:rgba(255,255,255,.08);opacity:1}
nav button[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1;box-shadow:inset 3px 0 0 var(--dore)}
nav svg{width:18px;height:18px;flex:none}
.side-pied{margin-top:auto;font-size:11.5px;opacity:.75;padding:0 8px}
.side-pied .mode{display:inline-block;margin-bottom:8px;padding:2px 8px;border-radius:99px;background:var(--dore);color:var(--nuit);font-weight:700;opacity:1}
main{padding:34px 40px 60px;max-width:1180px;width:100%}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--bordeaux)}
:root[data-theme="dark"] h1 em{color:var(--dore)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 em{color:var(--dore)}}
h2{font-size:17px;margin:28px 0 12px;font-weight:700}
.sous{color:var(--muted);margin:0 0 24px}
.grille{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.carte{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;position:relative}
.carte h3{margin:0 0 6px;font-size:15px;font-weight:700}
.carte p{margin:0;color:var(--muted);font-size:13.5px}
.chiffre{font-size:38px;font-weight:700;color:var(--bordeaux);line-height:1}
:root[data-theme="dark"] .chiffre{color:var(--dore)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chiffre{color:var(--dore)}}
.bandeau{border-top:4px solid var(--filet)}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bordeaux);background:var(--bordeaux);color:#fff;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--bordeaux)}
:root[data-theme="dark"] .btn.sec{color:var(--dore);border-color:var(--dore)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sec{color:var(--dore);border-color:var(--dore)}}
.btn.dore{background:var(--dore);border-color:var(--dore);color:var(--nuit)}
.btn[disabled]{opacity:.5;cursor:wait}
.btn.petit{padding:5px 10px;font-size:12.5px}
.barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.barre .esp{flex:1}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--dore);outline-offset:1px}
textarea{width:100%;resize:vertical}
label.ch{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px}
label.ch input,label.ch select,label.ch textarea{display:block;width:100%;margin-top:4px;font-weight:400;color:var(--fg)}
.liste{display:flex;flex-direction:column;gap:8px}
.ligne{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ligne.fait{opacity:.55}.ligne.fait .t{text-decoration:line-through}
.ligne .t{font-weight:600}
.ligne .m{font-size:12.5px;color:var(--muted)}
.coche{width:22px;height:22px;border-radius:7px;border:2px solid var(--bordeaux-2);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.coche.on{background:var(--dore);border-color:var(--dore)}
.pastille{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg-alt);color:var(--muted);margin-right:4px;white-space:nowrap}
.p-haute{background:var(--rose);color:var(--bordeaux)}
.p-idee{background:var(--bg-alt)}.p-en_cours{background:var(--mark);color:var(--nuit)}.p-pret{background:var(--sauge);color:var(--nuit)}
.p-retard{background:var(--alerte);color:#fff}
.onglets{display:flex;gap:6px;flex-wrap:wrap}
.onglets button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600}
.onglets button[aria-pressed="true"]{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
/* Boîte « Tuile » de la charte */
.tuile{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.tuile .ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#F2B705,#7B1E3A);color:#fff}
.tuile .ic svg{width:22px;height:22px}
.tuile b{display:block;font-size:11px;letter-spacing:.08em;color:var(--dore-txt)}
.tuile.q b{color:var(--bordeaux)}
.tuile p{margin:2px 0 0;font-size:13.5px}
.atelier{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px;align-items:start}
.resultat{min-height:420px;font-family:var(--font);font-size:14px;line-height:1.6}
.apercu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-height:640px;overflow:auto}
.apercu h1{font-size:22px;color:var(--bordeaux)} .apercu h2{color:var(--bordeaux);margin-top:18px}
.apercu h3{font-size:14.5px;margin:14px 0 6px}
.apercu .tuile{margin:10px 0}
.etat{padding:12px 14px;border-radius:12px;background:var(--dore-pale);border:1px solid var(--filet);font-size:13.5px;margin:12px 0}
.etat.err{background:var(--rose);border-color:var(--bordeaux-2)}
.vide{color:var(--muted);font-size:14px;padding:26px;text-align:center;border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 32px);background:var(--card);color:var(--fg);box-shadow:0 24px 60px rgba(28,20,23,.3)}
dialog::backdrop{background:rgba(28,20,23,.45)}
dialog form{padding:22px 24px}
dialog h3{margin:0 0 4px;font-size:18px}
.dlg-pied{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg-pied .gauche{margin-right:auto}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.outil{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit}
.outil:hover{border-color:var(--bordeaux-2)}
.outil .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--rose);display:grid;place-items:center;color:var(--bordeaux)}
.groupe{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dore-txt);margin:26px 0 10px}
.pied{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.chargement{display:grid;place-items:center;height:60vh;color:var(--muted)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--nuit);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:360px;z-index:9}
.burger{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:12px 16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .marque{margin:0;flex:1}
  .burger{display:inline-flex;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:7px 10px}
  nav{display:none;width:100%;margin-top:10px}
  aside.ouvert nav{display:block}
  .side-pied{display:none}
  main{padding:22px 16px 48px}
  h1{font-size:24px}
  .atelier,.deux{grid-template-columns:1fr}
  .ligne{grid-template-columns:auto 1fr}
  .ligne .act{grid-column:1/-1;justify-self:end}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side">
    <div class="marque">
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect x="1" y="1" width="98" height="98" rx="24" fill="#7B1E3A" stroke="rgba(255,255,255,.3)" stroke-width="2"/><path d="M68 32a26 26 0 1 0 0 36" fill="none" stroke="#F6E6EA" stroke-width="11" stroke-linecap="round"/><circle cx="74" cy="27" r="8" fill="#F2B705"/></svg>
      <div><b>PLAN B</b><small>Formation d'adultes · Création de cours</small></div>
    </div>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
    <nav id="nav"></nav>
    <div class="side-pied"><span class="mode" id="mode" hidden>Démonstration</span><div id="compte"></div></div>
  </aside>
  <main id="vue"><div class="chargement">Chargement de l'application…</div></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
/* Affiche toute erreur dans la page (utile dans l'application Google, sans console). */
window.addEventListener("error", function(e){ var v=document.getElementById("vue"); if(v) v.innerHTML='<div style="padding:16px;border-radius:12px;background:#F6E6EA;color:#7B1E3A;font-size:14px">Erreur de l\'application : '+String(e.message||e.error||"inconnue").replace(/</g,"&lt;")+'</div>'; });
</script>
<script>
(function(){
"use strict";
/* ===================== Accès serveur ===================== */
const ENLIGNE = typeof google !== "undefined" && google.script && google.script.run;
function api(action, data){
  if (ENLIGNE) return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e && e.message ? e : new Error(String(e)))).api(action, data || {}));
  return Demo.api(action, data || {});
}
/* Mode démonstration : données fictives dans ce navigateur, pour voir l'interface hors connexion Google. */
const Demo = {
  cle: "planb-demo-v1",
  lire(){ try { return JSON.parse(localStorage.getItem(this.cle)) } catch(e){ return null } },
  ecrire(d){ try { localStorage.setItem(this.cle, JSON.stringify(d)) } catch(e){} },
  base(){
    let d = this.lire();
    if (!d) { d = { taches:[
        {id:"x1",titre:"Exemple : relire la fiche d'intention",domaine:"Cours",priorite:"haute",statut:"a_faire",echeance:new Date(Date.now()+2*864e5).toISOString().slice(0,10),note:""},
        {id:"x2",titre:"Exemple : préparer l'exercice pratique",domaine:"Cours",priorite:"normale",statut:"en_cours",echeance:"",note:""}],
      cours:[{id:"y1",titre:"Exemple de cours",domaine:"Gestion de projets et planification",categorie:"general",statut:"en_cours",public:"Chefs d'équipe",duree:"½ jour",contenu:"Bases\nMéthode\nExercice",prioritaire:true}],
      demandes:[], documents:[] }; this.ecrire(d); }
    return d;
  },
  async api(a, p){
    await new Promise(r => setTimeout(r, 250));
    const d = this.base();
    if (a === "init") return { email:"démonstration", claude:false, modele:"—", demo:true, importe:true, classeurUrl:"#", dossierUrl:"https://drive.google.com/drive/folders/1SowWXzXezmBQXKQUMmZ2A6oL3LGGI6H4", dossierAppUrl:"#", donnees:d };
    if (a === "enregistrer"){ const l = d[p.collection]; const doc = Object.assign({}, p.doc);
      if(!doc.id) doc.id = "z"+Math.random().toString(36).slice(2,9); doc.maj = new Date().toISOString(); if(!doc.cree) doc.cree = doc.maj;
      const i = l.findIndex(x => x.id === doc.id); if (i>=0) l[i] = doc; else l.push(doc); this.ecrire(d); return doc; }
    if (a === "supprimer"){ d[p.collection] = d[p.collection].filter(x => x.id !== p.id); this.ecrire(d); return {ok:true}; }
    if (a === "proposer"){ const dem = {id:"d"+Date.now(), coursTitre:p.coursTitre, typeDoc:p.typeDoc, idees:p.idees, consignes:p.consignes, statut:"en_attente", reponse:"", cree:new Date().toISOString()};
      d.demandes.push(dem); this.ecrire(d); return {enAttente:true, demande:dem}; }
    if (a === "creerWord") throw new Error("En démonstration, aucun fichier n'est créé dans le Drive.");
    if (a === "importer") return {deja:true};
    throw new Error("Action inconnue");
  }
};

/* ===================== État ===================== */
const S = { info:null, d:{taches:[],cours:[],demandes:[],documents:[]}, vue:"accueil", filtreT:"ouvertes", filtreC:"tous", rechC:"", at:{} };
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const auj = () => new Date().toISOString().slice(0,10);
const dateFr = s => s ? new Date(s.length===10 ? s+"T12:00:00" : s).toLocaleDateString("fr-CH",{day:"numeric",month:"short",year:"numeric"}) : "";
function toast(t, ms=3800){ const e=document.createElement("div"); e.className="toast"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(), ms); }
function erreur(e){ console.error(e); toast("Erreur : " + (e && e.message || e), 7000); }

const IC = {
  accueil:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  taches:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  cours:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/>',
  atelier:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  outils:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  reglages:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.3 14H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6 1.6 1.6 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/>',
  ampoule:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  bulle:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 16h.01"/>',
  lien:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
};
const svg = (k, w=18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.lien}</svg>`;
const tuile = (type, texte) => `<div class="tuile ${type==="QUESTION"?"q":""}"><div class="ic">${svg(type==="QUESTION"?"bulle":"ampoule",22)}</div><div><b>${type}</b><p>${texte}</p></div></div>`;

const VUES = [
  ["accueil","Accueil"],["taches","Tâches"],["cours","Répertoire des cours"],["atelier","Atelier de création"],["outils","Mes outils"],["reglages","Réglages"]
];
function menu(){
  $("#nav").innerHTML = VUES.map(([k,t]) => `<button data-v="${k}" ${S.vue===k?'aria-current="page"':""}>${svg(k)}${t}</button>`).join("");
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (b){ aller(b.dataset.v); $("#side").classList.remove("ouvert"); } });
$("#burger").addEventListener("click", () => { const o = $("#side").classList.toggle("ouvert"); $("#burger").setAttribute("aria-expanded", o); });
function aller(v){ S.vue = v; try{ sessionStorage.setItem("planb-vue", v) }catch(e){} menu(); rendre(); window.scrollTo(0,0); }
function rendre(){ ({accueil:vAccueil,taches:vTaches,cours:vCours,atelier:vAtelier,outils:vOutils,reglages:vReglages}[S.vue]||vAccueil)(); }

const PIED = `<div class="pied">© 2026 Jean-François Caddoux · jfcpro.org — Application privée. J'utilise l'intelligence artificielle comme outil de préparation. Chaque contenu est conçu, relu et validé par moi.</div>`;

/* ===================== Accueil ===================== */
function vAccueil(){
  const t = S.d.taches.filter(x => x.statut !== "fait");
  const retard = t.filter(x => x.echeance && x.echeance < auj());
  const semaine = t.filter(x => x.echeance && x.echeance >= auj() && x.echeance <= new Date(Date.now()+7*864e5).toISOString().slice(0,10));
  const coursEnCours = S.d.cours.filter(c => c.statut === "en_cours");
  const attente = S.d.demandes.filter(d => d.statut === "en_attente");
  const h = new Date().getHours();
  $("#vue").innerHTML = `
    <h1>${h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir"} Jeff, <em>on avance.</em></h1>
    <p class="sous">Toutes les données de PLAN B, au même endroit, enregistrées dans ton Drive.</p>
    ${!S.info.importe && !S.info.demo ? `<div class="etat">Première ouverture : copie tes tâches et ton répertoire de cours actuels dans l'application. Les artefacts d'origine ne sont pas modifiés. <button class="btn petit" id="imp">Copier mes données</button></div>`:""}
    <div class="grille">
      <div class="carte bandeau"><div class="chiffre">${t.length}</div><h3>Tâches ouvertes</h3><p>${retard.length ? `<span class="pastille p-retard">${retard.length} en retard</span>` : "Aucune en retard"} · ${semaine.length} cette semaine</p></div>

async function creerWord(){
  const a = S.at, c = S.d.cours.find(x => x.id === a.coursId);
  const titre = a.typeDoc + (c ? " - " + c.titre : "");
  const b = $("#aWord"); b.disabled = true; b.textContent = "Création du Word…";

    toast("Word créé dans le Drive.");
  } catch(e){ erreur(e); }

function mdHtml(md){
  const inl = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let h = "", liste = null;
  const fin = () => { if (liste) { h += `</${liste}>`; liste = null; } };
  md.replace(/\r/g,"").split("\n").forEach(l => {
    let m;
    if (!l.trim()) { fin(); return; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { fin(); h += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; return; }
    if ((m = l.match(/^>\s*(ASTUCE|QUESTION)\s*:?\s*(.*)/i))) { fin(); h += tuile(m[1].toUpperCase(), inl(m[2])); return; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (liste!=="ul"){ fin(); h += "<ul>"; liste="ul"; } h += `<li>${inl(m[1])}</li>`; return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (liste!=="ol"){ fin(); h += "<ol>"; liste="ol"; } h += `<li>${inl(m[1])}</li>`; return; }
    fin(); h += `<p>${inl(l.replace(/^>\s*/,""))}</p>`;
  });
  fin(); return h;
}

  $("#vue").innerHTML = `<h1>Réglages</h1><p class="sous">État de l'application.</p>
    <div class="grille">
      <div class="carte"><h3>Compte</h3><p>${esc(S.info.email)}</p></div>
      <div class="carte"><h3>Claude</h3><p>${S.info.claude ? "Branché · modèle " + esc(S.info.modele) : "Non branché : les demandes vont en file d'attente."}</p></div>
      <div class="carte"><h3>Données</h3><p><a href="${esc(S.info.classeurUrl)}" target="_blank" rel="noopener">Classeur « Application PLAN B - données »</a></p></div>
    </div>
    ${tuile("ASTUCE", "Pour brancher Claude : dans le projet Google Apps Script « Application PLAN B », Paramètres du projet › Propriétés du script › ajouter ANTHROPIC_API_KEY avec ta clé (console.anthropic.com). La clé reste cachée côté Google, jamais dans cette page.")}
    <h2>Apparence</h2><div class="onglets">${[["auto","Automatique"],["light","Clair"],["dark","Sombre"]].map(([k,t])=>`<button data-th="${k}" aria-pressed="${(document.documentElement.dataset.theme||"auto")===k}">${t}</button>`).join("")}</div>${PIED}`;
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { const k=b.dataset.th; if(k==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=k; try{localStorage.setItem("planb-theme",k)}catch(e){} vReglages(); });
}

/* ===================== Outils communs ===================== */
async function sauver(col, doc, silencieux){
  try { const r = await api("enregistrer", {collection:col, doc}); const l = S.d[col]; const i = l.findIndex(x => x.id === r.id); if (i>=0) l[i] = r; else l.push(r); if (!silencieux) rendre(); return r; }
  catch(e){ erreur(e); }
}
async function retirer(col, id){
  try { await api("supprimer", {collection:col, id}); S.d[col] = S.d[col].filter(x => x.id !== id); rendre(); } catch(e){ erreur(e); }
}
function dialogue(html, surOk, surSuppr){
  const dlg = $("#dlg"), f = $("#dlgForm");
  f.innerHTML = html + `<div class="dlg-pied">${surSuppr?'<button type="button" class="btn sec gauche" id="dSup">Retirer</button>':""}<button type="button" class="btn sec" id="dAnn">Annuler</button><button class="btn" id="dOk" value="ok">Enregistrer</button></div>`;
  $("#dAnn").onclick = () => dlg.close();
  if (surSuppr) $("#dSup").onclick = async () => { dlg.close(); await surSuppr(); };
  f.onsubmit = async e => { e.preventDefault(); const v = {}; new FormData(f).forEach((val,k) => v[k] = val); f.querySelectorAll("input[type=checkbox]").forEach(cb => v[cb.name] = cb.checked); dlg.close(); await surOk(v); };
  dlg.showModal(); const p = f.querySelector("input,textarea"); if (p) p.focus();
}
function confirmer(q){
  return new Promise(ok => { const dlg = $("#dlg"), f = $("#dlgForm");
    f.innerHTML = `<h3>${esc(q)}</h3><div class="dlg-pied"><button type="button" class="btn sec" id="cNon">Non</button><button type="button" class="btn" id="cOui">Oui</button></div>`;
    $("#cNon").onclick = () => { dlg.close(); ok(false); }; $("#cOui").onclick = () => { dlg.close(); ok(true); }; dlg.showModal(); });
}
async function charger(){
  S.info = await api("init");
  S.d = Object.assign({taches:[],cours:[],demandes:[],documents:[]}, S.info.donnees);
  $("#mode").hidden = !S.info.demo; $("#compte").textContent = S.info.demo ? "Données fictives, rien n'est enregistré dans le Drive." : S.info.email;
  rendre();
}
(function demarrer(){
  try { const th = localStorage.getItem("planb-theme"); if (th && th!=="auto") document.documentElement.dataset.theme = th; } catch(e){}
  try { S.vue = sessionStorage.getItem("planb-vue") || "accueil"; } catch(e){}
  menu();
  charger().catch(e => { $("#vue").innerHTML = `<div class="etat err">Impossible de charger les données : ${esc(e.message||e)}</div>`; });
})();
})();
</script>
