<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bordeaux:#7B1E3A;--dore:#F2B705;--rose:#F6E6EA;--nuit:#1C1417}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#9C566B 0,#7B1E3A 45%,#4A0F22 100%);color:#FFF7F8;font:400 15px/1.6 "Sora","Segoe UI",system-ui,sans-serif;padding:24px 16px}
.c{max-width:440px;text-align:center}
h1{font-size:28px;margin:22px 0 8px}
p{opacity:.85;margin:0 0 26px}
a.btn{display:inline-block;background:var(--dore);color:var(--nuit);font-weight:700;text-decoration:none;padding:13px 22px;border-radius:12px}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
small{display:block;margin-top:28px;opacity:.6;font-size:12px}
</style>
</head>
<body>
<div class="c">
  <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#7B1E3A" stroke="rgba(255,255,255,.25)"/><path d="M68 32a26 26 0 1 0 0 36" fill="none" stroke="#F6E6EA" stroke-width="11" stroke-linecap="round"/><circle cx="74" cy="27" r="8" fill="#F2B705"/></svg>
  <h1>Espace privé</h1>
  <p>Accès réservé. La connexion se fait avec le compte Google autorisé.</p>
  <a class="btn" id="ouvrir" href="https://script.google.com/macros/s/A_REMPLACER/exec">Ouvrir l'application</a>
  <p id="attente" hidden style="margin:22px 0 0;font-size:13.5px">L'application est en cours d'installation. En attendant, tu peux <a href="app.html" style="color:#F2B705">voir la démonstration</a> (données fictives).</p>
  <small>© 2026 Jean-François Caddoux · jfcpro.org</small>
</div>
<script>
/* Tant que l'adresse du script Google n'est pas renseignée, le bouton ne mène nulle part. */
(function(){var b=document.getElementById("ouvrir");if(b.href.indexOf("A_REMPLACER")>-1){b.removeAttribute("href");b.textContent="Installation en cours";b.style.opacity=".6";b.style.cursor="default";document.getElementById("attente").hidden=false;}})();
</script>
</body>
</html>
